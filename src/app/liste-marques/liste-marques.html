<div class="container">
  <h2>Gestion des marques</h2>

  <div class="col-sm-6 col-md-5 mb-4">
    <app-update-marque
      [marque]="marqueSelectionnee"
      [ajout]="ajout"
      (marqueUpdated)="marqueUpdated($event)"
    />
  </div>

  <div class="alert alert-danger" *ngIf="message">{{ message }}</div>

  <table class="table table-striped">
    <thead>
      <tr>
        <th>Id</th>
        <th>Nom</th>
        <th>Description</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      @for (marque of marques; track marque.id) {
        <tr>
          <td>{{ marque.id }}</td>
          <td>{{ marque.nom }}</td>
          <td>{{ marque.description }}</td>
          <td>
            <button type="button" class="btn btn-success btn-sm" (click)="selectionnerMarque(marque)">
              Modifier
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4">Aucune marque disponible.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
