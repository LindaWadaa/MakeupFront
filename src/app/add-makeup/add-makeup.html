<div class="container">
    <div>
        <h2>Ajouter un makeup :</h2>
    </div>
    <form>
        <div hidden class="col-sm-2 col-md-2 col-lg-2">
            <label>ID Makeup</label>
            <input  type="text" [(ngModel)]="newMakeup.id" name="idMakeup" class="form-control">
        </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Nom Makeup</label>
            <input type="text" [(ngModel)]="newMakeup.nom" name="nomMakeup" class="form-control">
        </div>
        <div class="col-sm-2 col-md-2 col-lg-2">
            <label>Prix Makeup</label>
            <input type="number" [(ngModel)]="newMakeup.price" name="prixMakeup" class="form-control">
        </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Date d'expiration</label>
            <input type="date" [(ngModel)]="newMakeup.dateExpiration" name="dateExpiration" class="form-control">
        </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Description</label>
            <input type="text" [(ngModel)]="newMakeup.description" name="description" class="form-control">
        </div>


         <div class="col-sm-4 col-md-4 col-1g-4">
            <label>Marque</label>
            <select class="form-control form-control-1g" id="idMarque" name="idMarque" [(ngModel)]="newIdMarque">
                @for(marque of marques; track marque.id ?? marque.idMarque ?? marque.idmarque){
                    <option [ngValue]="marque.id ?? marque.idMarque ?? marque.idmarque">
                        {{marque.nom ?? marque.nomMarque ?? marque.nommarque}}
                    </option>
                }
            </select>
        </div> 

        

        
        <div class="mt-2">
            <button type="button" (click)="addMakeup()" class="btn btn-success">Ajouter</button>
            <div class="alert alert-success" *ngIf="message">
                {{ message }}
            </div>
        </div>
    </form>
</div>
