<div class="container">
    <div>
        <h2>Modifier un makeup :</h2>
    </div>
    <form>
        <div  class="col-sm-2 col-md-2 col-lg-2">
            <label>ID Makeup</label>
            <input readonly type="text" [(ngModel)]="currentMakeup.id" name="idMakeup" class="form-control">
        </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Nom Makeup</label>
            <input type="text" [(ngModel)]="currentMakeup.nom" name="nomMakeup" class="form-control">
        </div>
        <div class="col-sm-2 col-md-2 col-lg-2">
            <label>Prix Makeup</label>
            <input type="number" [(ngModel)]="currentMakeup.price" name="prixMakeup" class="form-control">
        </div>
        <div class="col-sm-4 col-md-4 col-1g-4">
            <label>Date expiration</label>
            <input type="date" [(ngModel)]="dateExpiration" name="dateExpiration" class="form-control">

        </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Description</label>
            <input type="text" [(ngModel)]="currentMakeup.description" name="description" class="form-control">
        </div>

        <div class="col-sm-16 col-md-16 col-lg-16">
            <label class="mb-2">Image :</label>
            <input type="file" (change)="onImageUpload($event)" class="form-control">
        </div>
        <div class="mt-2">
            <button type="button" (click)="onAddImageProduit()" class="btn btn-success">Ajouter Image</button>
        </div>
        <div class="col-sm-16 col-md-16 col-lg-16">
            <img [src]="myImage" class="card-img-top img-fluid rounded-start" style="width: 500px; height: 300px" />
        </div>

        <div class="card shadow mb-4">
            <div class="card-body">
                <table class="table table-striped">
                    <thead><tr><th>Images</th><th>Action</th></tr></thead>
                    @for(img of currentMakeup.images; track img.idImage) {
                        <tbody>
                            <tr>
                                <td><img class="card-img-top img-responsive" [src]="'data:' + img.type + ';base64,' + img.image" style="height :50px;width:100px"></td>
                                <td style="width:20%"><a class="btn btn-danger" (click)="supprimerImage(img)">Supprimer</a></td>
                            </tr>
                        </tbody>
                    }
                </table>
            </div>
        </div>


        <div class="col-sm-4 col-md-4 col-1g-4">
            <label>Marque</label>
            <select class="form-control form-control-1g" id="idMarque" name="idMarque" [(ngModel)]="updatedMarqueId">
                @for(marque of marques; track marque.id ?? marque.idMarque ?? marque.idmarque){
                    <option [ngValue]="marque.id ?? marque.idMarque ?? marque.idmarque">
                        {{marque.nom ?? marque.nomMarque ?? marque.nommarque}}
                    </option>
                }
            </select>
        </div> 
        <div class="mt-2">
            <button type="button" (click)="updateMakeup()" class="btn btn-success">Modifier</button>
            <div class="alert alert-danger" *ngIf="message">
                {{ message }}
            </div>
        </div>
    </form>
</div>
