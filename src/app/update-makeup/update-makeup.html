<div class="container">
    <div>
        <h2>Modifier un makeup :</h2>
    </div>
    <form>
        <div  class="col-sm-2 col-md-2 col-lg-2">
            <label>ID Makeup</label>
            <input readonly type="text" [(ngModel)]="currentMakeup.id" name="idMakeup" class="form-control">
        </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Nom Makeup</label>
            <input type="text" [(ngModel)]="currentMakeup.nom" name="nomMakeup" class="form-control">
        </div>
        <div class="col-sm-2 col-md-2 col-lg-2">
            <label>Prix Makeup</label>
            <input type="number" [(ngModel)]="currentMakeup.price" name="prixMakeup" class="form-control">
        </div>
        <div class="col-sm-4 col-md-4 col-1g-4">
            <label>Date expiration</label>
            <input type="date" [(ngModel)]="dateExpiration" name="dateExpiration" class="form-control">

        </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>marque</label>
            <input type="text" [(ngModel)]="currentMakeup.marque" name="description" class="form-control">
        </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Description</label>
            <input type="text" [(ngModel)]="currentMakeup.description" name="description" class="form-control">
        </div>


        <div class="col-sm-4 col-md-4 col-1g-4">
            <label>Categorie</label>
            <select class="form-control form-control-1g" id="idCat" name="idCat" [(ngModel)]="updatedCatId">
                @for(cat of categories; track cat.idcat ?? cat.idCat){
                    <option [ngValue]="cat.idcat ?? cat.idCat">
                        {{cat.nom ?? cat.nomCat}}
                    </option>
                }
            </select>
        </div> 
        <div class="mt-2">
            <button type="button" (click)="updateMakeup()" class="btn btn-success">Modifier</button>
            <div class="alert alert-danger" *ngIf="message">
                {{ message }}
            </div>
        </div>
    </form>
</div>
